name: Sync Google Scholar metrics

on:
  schedule:
    # Mondays 06:00 UTC (~14:00 HKT)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-scholar-metrics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/sync_scholar_metrics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html *.html
          if git diff --staged --quiet; then
            echo "No metric changes to commit."
            exit 0
          fi
          git commit -m "Sync Google Scholar citation metrics."
          git push
